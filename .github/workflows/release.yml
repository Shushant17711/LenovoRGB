name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install "pyinstaller>=6.6"

      - name: Build
        run: python -m PyInstaller --noconfirm packaging/LenovoRGB.spec

      - name: Checksum
        shell: pwsh
        run: |
          Get-FileHash dist\LenovoRGB.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  LenovoRGB.exe" } |
            Out-File -Encoding ascii dist\LenovoRGB.exe.sha256

      - name: Upload manual build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: LenovoRGB-windows-x64
          path: |
            dist/LenovoRGB.exe
            dist/LenovoRGB.exe.sha256
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LenovoRGB.exe
            dist/LenovoRGB.exe.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

  package:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload manual packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
