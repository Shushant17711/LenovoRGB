[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lenovorgb"
version = "2.0.0"
description = "Cross-platform controller for Lenovo LOQ / Legion 4-zone RGB keyboards"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shushant", email = "Shushant17711@users.noreply.github.com" }]
keywords = ["lenovo", "loq", "legion", "rgb", "keyboard", "hid", "linux", "windows"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Hardware",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "hidapi>=0.15.0",
  "numpy>=1.24",
  "psutil>=5.9",
  "pynput>=1.7.6",
  "evdev>=1.6; sys_platform == 'linux'",
]

[project.optional-dependencies]
audio = ["soundcard>=0.4.3"]
screen = ["mss>=9.0", "Pillow>=10.0"]
gui = ["pystray>=0.19.4", "Pillow>=10.0"]
all = [
  "soundcard>=0.4.3",
  "mss>=9.0",
  "pystray>=0.19.4",
  "Pillow>=10.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff==0.17.1",
]
build = ["pyinstaller>=6.6"]

[project.scripts]
lenovorgb = "lenovorgb.cli:main"

[project.gui-scripts]
lenovorgb-gui = "lenovorgb.cli:gui_entry"

[project.urls]
Homepage = "https://github.com/Shushant17711/LenovoRGB"
Issues = "https://github.com/Shushant17711/LenovoRGB/issues"
Documentation = "https://github.com/Shushant17711/LenovoRGB#readme"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lenovorgb = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105", "UP006", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
